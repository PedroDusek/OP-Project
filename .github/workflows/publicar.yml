name: Publicar

# Publica a `main` na Fly.io (decisao 089).
#
# **So a mao** (Actions -> Publicar -> Run workflow), e nao a cada merge.
# Producao nunca e o alvo padrao neste projeto: um merge que precisa de migration
# nova, publicado antes de `npm run supabase migrate`, derruba a tela inteira. A
# ordem e sempre `npm run supabase status`, a migration se faltar, e so entao
# publicar.
#
# Como no workflow de precos, sem o segredo FLY_API_TOKEN ele termina sem erro
# dizendo que pulou.

on:
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar na Fly.io
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30

    steps:
      - name: Conferir os segredos
        id: token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::FLY_API_TOKEN nao existe no repositorio; nada foi publicado."
            echo "pular=true" >> "$GITHUB_OUTPUT"
          fi
          # O aquecer le a lista de cartas no banco de producao.
          if [ -n "$SUPABASE_DATABASE_URL" ]; then
            echo "aquecer=sim" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SUPABASE_DATABASE_URL nao existe; as imagens nao serao preparadas."
          fi

      - uses: actions/checkout@v5
        if: steps.token.outputs.pular != 'true'

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.token.outputs.pular != 'true'

      # O build roda fora daqui, nos builders geridos (Depot), e nao numa
      # maquina de build nossa: `--remote-only` criava o app `fly-builder-...`
      # com uma maquina shared-cpu-4x e um **volume de 50 GB**, cobrado o mes
      # inteiro por causa de builds de dois minutos (armadilha 64). Os tres
      # valores publicos vem das *variables* do repositorio (nao dos *secrets*):
      # vao para o pacote do navegador de qualquer jeito.
      - name: Publicar
        if: steps.token.outputs.pular != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: >-
          flyctl deploy --depot=true --ha=false
          --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          --build-arg NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

      # Decisao 094: o disco da maquina e novo a cada publicacao, entao a
      # primeira pessoa a ver cada carta esperaria ~3 s pela ida ate o Japao.
      # Falhar aqui nao derruba a publicacao: o site ja esta no ar, e o aquecer
      # e conveniencia.
      - uses: actions/setup-node@v5
        if: steps.token.outputs.pular != 'true' && steps.token.outputs.aquecer == 'sim'
        with:
          node-version: 20
          cache: npm

      - name: Preparar as imagens das cartas
        if: steps.token.outputs.pular != 'true' && steps.token.outputs.aquecer == 'sim'
        continue-on-error: true
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          DATABASE_URL: postgresql://nao-usar:nao-usar@127.0.0.1:5432/nao-usar
          # O endereco oficial desde 21/09. O cache das imagens nao se perde na
          # troca: a chave dele e a URL da imagem na Bandai, e nao o nosso
          # dominio.
          APP_URL: https://colexa.com.br
        run: |
          npm ci
          npx prisma generate
          npm run supabase aquecer -- --limite=200
